<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(baloo600.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(baloo800.woff2) format('woff2'); }
</style>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3d9ff; font-family: 'Baloo 2', system-ui, sans-serif; color: #5a2a6e; touch-action: none; overscroll-behavior: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1000px; height: 750px; transform-origin: center center; overflow: hidden; border-radius: 28px; box-shadow: 0 10px 40px rgba(90,42,110,.25); background: #fff; }
  .scene { position: absolute; inset: 0; display: none; }
  .scene.on { display: block; }
  .abs { position: absolute; }

  /* HOUSE */
  .wall { position: absolute; left: 0; top: 0; width: 1000px; height: 320px; background: #fbf4e8; border-bottom: 14px solid #e9c99b; }
  .floor { position: absolute; left: 0; top: 320px; width: 1000px; height: 430px; background-color: #e9fbf2; background-image: repeating-conic-gradient(#bfeedd 0 25%, #f4fff9 0 50%); background-size: 70px 70px; }
  #night { position: absolute; inset: 0; background: rgba(20,20,80,.55); opacity: 0; transition: opacity 1s; pointer-events: none; z-index: 40; }
  #night.on { opacity: 1; }
  .cover { position: absolute; z-index: 30; cursor: pointer; }
  .cover.wiggle { animation: wig .5s; }
  @keyframes wig { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }

  /* GARDEN */
  #s-garden .sky { position: absolute; inset: 0 0 auto 0; height: 380px; background: linear-gradient(#8fd8ff, #d8f4ff); }
  #s-garden .grass { position: absolute; left: 0; top: 380px; width: 1000px; height: 370px; background: linear-gradient(#8fe07a, #5cc35a); }
  .cloud { position: absolute; font-size: 80px; opacity: .95; animation: drift linear infinite; pointer-events: none; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
  .leaf { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7fd65f, #3e9e3a); }
  #tree.shake { animation: wig .5s; }
  .apple { position: absolute; font-size: 46px; z-index: 26; cursor: pointer; transition: left .6s, top .6s, transform .6s; }
  #pond { position: absolute; left: 60px; top: 560px; width: 250px; height: 90px; border-radius: 50%; background: radial-gradient(#7fd3ff, #3aa6e0); z-index: 5; }
  #duck { position: absolute; left: 140px; top: 535px; font-size: 64px; z-index: 6; cursor: pointer; transform: scaleX(-1); transition: left .6s; }
  .flower { position: absolute; width: 60px; height: 110px; z-index: 12; transform-origin: 50% 100%; transition: transform .6s, filter .6s; }
  .flower.thirsty { transform: scale(.55) rotate(18deg); filter: saturate(.25) brightness(.9); }
  #swing { position: absolute; left: 650px; top: 205px; width: 100px; height: 255px; transform-origin: 50px 0; z-index: 18; cursor: pointer; }
  #swing.push { animation: swingit 1.6s ease-in-out; }
  @keyframes swingit { 20% { transform: rotate(28deg); } 50% { transform: rotate(-22deg); } 75% { transform: rotate(12deg); } 100% { transform: rotate(0); } }
  .bfly { position: absolute; font-size: 48px; z-index: 50; cursor: pointer; transition: left 2.2s ease-in-out, top 2.2s ease-in-out; }
  .bub { position: absolute; width: 80px; height: 80px; border-radius: 50%; z-index: 50; cursor: pointer; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95) 0 8%, rgba(200,240,255,.35) 30%, rgba(255,180,240,.35) 70%, rgba(255,255,255,.7) 100%); box-shadow: inset 0 0 10px rgba(255,255,255,.8); }
  .drop { position: absolute; font-size: 26px; pointer-events: none; z-index: 60; animation: dropf .7s ease-in forwards; }
  @keyframes dropf { to { transform: translateY(70px); opacity: 0; } }

  /* SHOP */
  .shelf { position: absolute; left: 70px; width: 560px; height: 18px; background: #b97a45; border-radius: 6px; box-shadow: 0 6px 0 #8d5a30; }
  .item { position: absolute; font-size: 60px; z-index: 25; cursor: grab; transition: left .45s, top .45s, opacity .4s, transform .3s; }
  .item.dragging, .toy.dragging, .pencil.dragging, .bread.dragging, #can.dragging { transition: none !important; z-index: 70 !important; }
  .item.dragging { transform: scale(1.25); }

  /* KITCHEN */
  #s-kitchen .kwall { position: absolute; inset: 0 0 auto 0; height: 330px; background-color: #e6f6ff; background-image: linear-gradient(90deg, rgba(255,255,255,.9) 2px, transparent 2px), linear-gradient(rgba(255,255,255,.9) 2px, transparent 2px); background-size: 50px 50px; border-bottom: 14px solid #9fd0ea; }
  #s-kitchen .kfloor { position: absolute; left: 0; top: 330px; width: 1000px; height: 420px; background: repeating-linear-gradient(90deg, #f7d9a8 0 80px, #efc98f 80px 160px); }
  .kbtn { position: absolute; width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,.15); cursor: pointer; font-size: 38px; display: flex; align-items: center; justify-content: center; background: #fff; z-index: 40; }
  .kbtn:active { transform: translateY(4px); }
  .topping { position: absolute; font-size: 38px; pointer-events: none; animation: pop .3s; }

  /* WARDROBE */
  #s-wardrobe .wbg { position: absolute; inset: 0; background-color: #ffe6f4; background-image: radial-gradient(#ffc6e6 18%, transparent 19%); background-size: 46px 46px; }
  #panel { position: absolute; left: 250px; top: 40px; width: 360px; height: 580px; border-radius: 30px; overflow: hidden; border: 10px solid #fff; box-shadow: 0 10px 0 rgba(0,0,0,.08); transition: background .5s; }
  #panel .deco { position: absolute; font-size: 48px; pointer-events: none; }
  #bigdoll { position: absolute; left: 60px; top: 30px; z-index: 5; }
  .dpick { position: absolute; left: 60px; width: 160px; height: 110px; border-radius: 24px; background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.1); cursor: pointer; overflow: hidden; display: flex; align-items: center; gap: 4px; padding-left: 6px; font-size: 24px; font-weight: 800; }
  .dpick.sel { outline: 6px solid #ff7eb6; }
  #dresses { position: absolute; left: 660px; top: 100px; width: 290px; display: grid; grid-template-columns: repeat(4, 66px); gap: 6px; }
  .dcell { width: 66px; height: 74px; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.1); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; }
  .dcell.sel { outline: 5px solid #ff7eb6; }
  .dcell.locked svg { opacity: .25; }
  .dcell.locked::after { content: '🔒'; position: absolute; font-size: 30px; }
  .acc { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.1); font-size: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .acc.sel { outline: 5px solid #ff7eb6; }

  /* CHARACTERS */
  .toy { position: absolute; cursor: pointer; z-index: 20; transition: left .7s, top .7s, opacity .4s; }
  .toy .body { animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  .toy.jump .body { animation: jump .6s ease-out; }
  .toy.dance .body { animation: dance .5s ease-in-out infinite alternate; }
  .toy.talking .body, #bigdoll.talking svg { animation: chatter .28s ease-in-out infinite alternate; }
  .toy.hiding { z-index: 25; }
  .toy.hiding .body { animation: peek 2.5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) scaleY(1.02); } }
  @keyframes jump { 30% { transform: translateY(-60px) scale(1.08); } 60% { transform: translateY(0) scale(1.1,.9); } }
  @keyframes dance { from { transform: rotate(-10deg); } to { transform: rotate(10deg) translateY(-25px); } }
  @keyframes chatter { from { transform: scale(1,1) rotate(-2deg); } to { transform: scale(1.04,.96) rotate(2deg); } }
  @keyframes peek { 0%, 100% { transform: translateY(14px); } 50% { transform: translateY(0); } }
  .eyes { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .asleep .eyes { animation: none; transform: scaleY(.12); }

  /* HUD */
  #dock { position: absolute; left: 50%; transform: translateX(-50%); bottom: 26px; display: flex; gap: 14px; z-index: 90; background: rgba(255,255,255,.7); padding: 10px 16px; border-radius: 60px; }
  .dockbtn { width: 82px; height: 82px; border-radius: 50%; border: none; background: #fff; font-size: 44px; box-shadow: 0 6px 0 rgba(0,0,0,.15); cursor: pointer; position: relative; }
  .dockbtn.here { background: #ffd6ec; outline: 5px solid #ff7eb6; }
  .dockbtn.target { animation: dpulse .8s infinite alternate; }
  @keyframes dpulse { to { transform: scale(1.18); box-shadow: 0 0 0 10px rgba(255,126,182,.5); } }
  .dockbtn .badge { position: absolute; right: -6px; top: -8px; font-size: 26px; }
  #task { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); background: #fff; border-radius: 40px; padding: 6px 26px; font-size: 30px; font-weight: 800; box-shadow: 0 6px 0 rgba(0,0,0,.12); z-index: 95; white-space: nowrap; display: none; cursor: pointer; }
  #stars { position: absolute; right: 50px; top: 40px; background: #fff; border-radius: 40px; padding: 4px 18px; font-size: 30px; z-index: 95; box-shadow: 0 6px 0 rgba(0,0,0,.12); }
  .tick { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: none; background: #fff; font-size: 52px; box-shadow: 0 6px 0 rgba(0,0,0,.15); z-index: 85; cursor: pointer; display: none; animation: dpulse .8s infinite alternate; }
  .bubble { position: absolute; background: #fff; border-radius: 24px; padding: 6px 18px; font-size: 26px; font-weight: 800; white-space: nowrap; box-shadow: 0 6px 0 rgba(0,0,0,.1); z-index: 88; pointer-events: none; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.3); } }
  .glowbox { animation: glow 1s infinite alternate; border-radius: 20px; }
  @keyframes glow { from { box-shadow: 0 0 0 6px rgba(255,120,200,.3); } to { box-shadow: 0 0 0 18px rgba(255,120,200,.75); } }
  .spark { position: absolute; font-size: 40px; pointer-events: none; z-index: 99; animation: burst .8s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
  .zzz { position: absolute; font-size: 44px; font-weight: 800; color: #6a7bff; z-index: 45; pointer-events: none; animation: zz 2s ease-out infinite; }
  @keyframes zz { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(40px,-90px) scale(1.3); opacity: 0; } }
  .bigstar { position: absolute; left: 450px; top: 300px; font-size: 120px; z-index: 99; pointer-events: none; animation: starfly 1.4s ease-in forwards; }
  @keyframes starfly { 0% { transform: scale(.2); } 40% { transform: scale(1.3); } 100% { transform: translate(430px, -260px) scale(.3); opacity: .3; } }
  #eyes { position: absolute; inset: 0; z-index: 110; background: rgba(90,42,110,.85); display: none; align-items: center; justify-content: center; flex-direction: column; color: #fff; }
  #eyes.on { display: flex; }
  #eyes .m { font-size: 150px; } #eyes .n { font-size: 130px; font-weight: 800; }
  .confetti { position: absolute; top: -40px; font-size: 40px; z-index: 96; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(820px) rotate(720deg); } }

  /* INTRO */
  #intro { position: absolute; inset: 0; z-index: 200; background: #000; }
  #intro img { width: 100%; height: 100%; object-fit: cover; }
  #intro .glow { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,220,255,0), rgba(80,0,90,.45)); }
  #wake { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); border: none; border-radius: 60px; background: linear-gradient(#ff8cc6, #d45cff); color: #fff; font-family: inherit; font-size: 52px; font-weight: 800; padding: 18px 50px; box-shadow: 0 10px 0 #9b2fb8, 0 0 40px #fff; animation: wpulse 1.2s infinite alternate; cursor: pointer; white-space: nowrap; }
  @keyframes wpulse { to { transform: translateX(-50%) scale(1.07); } }
  .istar { position: absolute; font-size: 44px; animation: twinkle 1.4s infinite alternate; pointer-events: none; }
  @keyframes twinkle { from { opacity: .2; transform: scale(.6); } to { opacity: 1; transform: scale(1.2) rotate(40deg); } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 220; }
  #flash.go { animation: flash 1.2s ease-out; }
  @keyframes flash { 30% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="stage">

  <!-- ================= HOUSE ================= -->

    </div>

      <rect x="8" y="10" width="194" height="40" rx="18" fill="#4aa6e8"/>
      <circle cx="14" cy="30" r="14" fill="#f3c93b"/><circle cx="196" cy="30" r="14" fill="#f3c93b"/>
      <rect x="15" y="40" width="180" height="270" rx="16" fill="#6ec3ff"/>
      <rect x="70" y="56" width="70" height="34" rx="12" fill="#fff8e6"/>
      <path d="M30 140 q20 -14 40 0 t40 0 t40 0 t20 0" stroke="#a8dcff" stroke-width="6" fill="none"/>
      <path d="M30 210 q20 -14 40 0 t40 0 t40 0 t20 0" stroke="#a8dcff" stroke-width="6" fill="none"/>
      <circle cx="16" cy="300" r="16" fill="#f3c93b"/><circle cx="194" cy="300" r="16" fill="#f3c93b"/>
    </svg>
    <svg id="blanket" class="abs" style="left:75px;top:480px;z-index:35;display:none" width="170" height="175" viewBox="0 0 180 200">
      <rect width="180" height="200" rx="20" fill="#ff9fd2"/>
      <circle cx="40" cy="50" r="10" fill="#fff"/><circle cx="110" cy="90" r="10" fill="#fff"/><circle cx="60" cy="140" r="10" fill="#fff"/><circle cx="140" cy="160" r="10" fill="#fff"/>
    </svg>
    <div id="jar" class="abs" style="left:300px;top:350px;width:76px;height:96px;background:rgba(220,240,255,.75);border:4px solid #b9d8ee;border-radius:8px 8px 16px 16px;z-index:22"></div>
    <div class="cover" id="toybox" style="left:640px;top:430px;width:170px;height:120px;background:#c98a4f;border-radius:14px;border-top:22px solid #a96c37;box-shadow:0 8px 0 rgba(0,0,0,.12);font-size:44px;text-align:center;line-height:90px">⭐🧸⭐</div>
    <div class="cover" id="cushion" style="left:420px;top:520px;width:180px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 35%, #ffb6dc, #ff7fbf)"></div>
    <div id="night"></div>
    <button class="tick" id="drawTick" style="left:290px;top:110px">✅</button>

  <!-- ================= GARDEN ================= -->

      <div class="leaf" style="left:120px;top:80px;width:170px;height:170px"></div>

      <div class="leaf" style="left:50px;top:150px;width:190px;height:150px"></div>

  <!-- ================= SHOP ================= -->

    <div class="wall" style="background:#fff3c4;border-bottom-color:#f0c96a"></div><div class="floor" style="background-image:repeating-conic-gradient(#ffe0a8 0 25%, #fff7e6 0 50%)"></div>

}

}

    fetch('voices.mp3').then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => ac.decodeAudioData(b, ok, no))).then(buf => { vsprite = buf; }).catch(() => { vloading = false; });
  } catch (e) { vloading = false; }
}

  try { if (vsrc) { vsrc.onended = null; vsrc.stop(); } } catch (e) {} vsrc = null;

function speakerEl(who) {

}

  if (who === 'narrator') lastNar = text;

  const el = speakerEl(who); speakingEl = el;
  let finished = false;
  const fin = () => { if (finished) return; finished = true; if (el) el.classList.remove('talking'); if (speakingEl === el) speakingEl = null; done && done(); };
  const backup = setTimeout(fin, 2500 + text.length * 90);
  const ended = () => { clearTimeout(backup); setTimeout(fin, 250); };
  if (el) el.classList.add('talking');
  const seg = VOS[who + '|' + text];

}

// ======================= dragging =======================
function draggable(el, o) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    const parent = el.parentElement, pr = rectOf(parent);
    const p = toStage(e), start = p; let moved = false;
    const orig = { l: el.offsetLeft, t: el.offsetTop }, off = { x: p.x - pr.l - orig.l, y: p.y - pr.t - orig.t };
    try { el.setPointerCapture(e.pointerId); } catch (er) {}

      if (moved) { el.style.left = (q.x - pr.l - off.x) + 'px'; el.style.top = (q.y - pr.t - off.y) + 'px'; o.onMove && o.onMove(q.x, q.y); }
    };
    const up = ev => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);

      if (!moved) { o.onTap && o.onTap(); return; }

      if (!keep) { el.style.left = orig.l + 'px'; el.style.top = orig.t + 'px'; }

  });

draggable($('#can'), {

function pushSwing() {
  const s = $('#swing'); s.classList.remove('push'); void s.offsetWidth; s.classList.add('push'); tone(500, .3, 'triangle', .12);

function addButterfly() {
  const b = document.createElement('div'); b.className = 'bfly'; b.textContent = '🦋';
  const go = () => { b.style.left = rand(80, 860) + 'px'; b.style.top = rand(80, 520) + 'px'; };
  b.style.left = rand(80, 860) + 'px'; b.style.top = rand(80, 520) + 'px'; $('#s-garden').appendChild(b);
  const iv = setInterval(() => { if (!b.isConnected) return clearInterval(iv); go(); }, 2300);

  });

setInterval(() => { if (started && !$$('.bfly').length && Math.random() < .5) addButterfly(); }, 12000);
function addBubble(t) {
  const b = document.createElement('div'); b.className = 'bub';
  let x = rand(100, 820), y = 590; const sp = rand(35, 60), ph = rand(0, 6);
  b.style.left = x + 'px'; b.style.top = y + 'px'; $('#s-garden').appendChild(b);
  let last = performance.now();
  const anim = now => {
    if (!b.isConnected) return; const dt = (now - last) / 1000; last = now;
    y -= sp * dt; if (y < 60) y = 590;
    b.style.top = y + 'px'; b.style.left = (x + Math.sin(now / 600 + ph) * 20) + 'px';
    requestAnimationFrame(anim);
  };
  requestAnimationFrame(anim);
  tap(b, () => {
    sparkleEl(b, ['✨', '💦']); tone(rand(900, 1300), .08, 'sine', .15); b.remove();
    if (t && task === t && t.phase === 'active') { t.data.left--; if (t.data.left <= 0) setTimeout(() => finishTask(), 500); }
  });
}

const shelfY = [130, 250, 370];
Object.entries(ITEMS).forEach(([name, em], i) => {
  const x = 100 + (i % 4) * 135, y = shelfY[Math.floor(i / 4)];
  const it = document.createElement('div'); it.className = 'item'; it.textContent = em; it.style.left = x + 'px'; it.style.top = y + 'px';
  $('#s-shop').appendChild(it);
  const respawn = () => { it.style.transition = 'none'; it.style.opacity = 0; it.style.left = x + 'px'; it.style.top = y + 'px'; void it.offsetWidth; it.style.transition = ''; it.style.opacity = 1; };
  draggable(it, {
    onTap: () => { plop(); it.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], 300); },
    onDrop: (px, py) => {
      if (!inside(px, py, $('#trolley'), 30)) return false;
      const t = task;
      if (t && t.tpl === 'shop' && t.phase === 'active') {
        const want = t.data.want[t.data.i];
        if (name !== want) { oops(); sayAll([[L.nar.notThat], [L.nar.item(want)]]); return false; }
        $('#cart').textContent += em; plop(); sparkle(px, py); respawn(); t.data.i++;
        if (t.data.i >= 3) { setTimeout(() => finishTask(), 600); t.cleanup = () => { $('#cart').textContent = ''; }; }
        else { say(L.nar.item(t.data.want[t.data.i])); setLabel('🛒 Find ' + ITEMS[t.data.want[t.data.i]]); }
        return true;
      }
      if ($('#cart').textContent.length > 16) $('#cart').textContent = '';
      $('#cart').textContent += em; plop(); sparkle(px, py); respawn(); return true;
    }
  });
});
